repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.17.1
    hooks:
      - id: mypy
        additional_dependencies:
          - streamlit>=1.37,<2
          - openai>=1.40,<2
          - pydantic>=2.7,<3
          - tenacity>=8.2,<10
          - pytest>=8.2,<9
