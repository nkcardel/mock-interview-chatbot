[project]
name = "mock-interview-chatbot"
version = "0.1.0"
description = "Streamlit mock job interview chatbot with structured-output feedback scoring."
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.37,<2",
    "openai>=1.40,<2",
    "pydantic>=2.7,<3",
    "tenacity>=8.2,<10",
]

[project.optional-dependencies]
test = ["pytest>=8.2,<9"]
dev = ["ruff>=0.6,<1", "pre-commit>=3.7,<4", "mypy>=1.10,<3"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = ["-m", "not model_eval"]
markers = [
    "model_eval: calls the OpenAI API, costs money, non-deterministic (run explicitly with -m model_eval)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # ruff format doesn't wrap long strings/URLs; long HTML f-strings in ui.py are expected

[tool.ruff.lint.isort]
known-first-party = ["app", "ui", "prompts", "schemas", "question_bank", "eval_cache"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
